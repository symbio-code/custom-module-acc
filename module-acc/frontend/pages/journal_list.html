{% extends 'layouts/app.html' %}
{% block title %}Journal Entries{% endblock %}
{% block content %}
<div>
  <div class="flex items-center justify-between">
    <h1 class="text-4xl font-black">Journal Entries</h1>
    <div class="flex gap-3">
      <button class="px-4 h-10 rounded-lg border">Export as CSV</button>
      <a href="/journal/new" class="px-4 h-10 rounded-lg bg-primary text-white flex items-center">New Journal Entry</a>
    </div>
  </div>
  <div class="mt-6">
    <form class="flex gap-4 items-end flex-wrap">
      <label class="flex flex-col"><span>Start Date</span><input type="date" class="form-input" name="start"/></label>
      <label class="flex flex-col"><span>End Date</span><input type="date" class="form-input" name="end"/></label>
      <label class="flex-1"><span class="sr-only">Search</span><input class="form-input" placeholder="Search by Reference or Description..."/></label>
      <button class="px-4 h-10 rounded-lg bg-primary/20 text-primary">Apply Filters</button>
    </form>
  </div>
  <div class="mt-6">
    {% include 'components/table.html' with cols=['Date','Reference','Description','Total Debit','Total Credit','Actions'] rows=rows %}
  </div>
</div>
{% endblock %}
