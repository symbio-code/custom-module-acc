<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <script id="tailwind-config">tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#137fec','background-light':'#f6f7f8','background-dark':'#101922'},fontFamily:{display:['Manrope','sans-serif']}}}}</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-background-dark rounded-xl shadow-lg p-8">
      <div class="text-center mb-6">
        <div class="h-12 w-12 mx-auto rounded-full bg-primary/10 flex items-center justify-center">
          <svg class="h-6 w-6 text-primary" fill="currentColor" viewBox="0 0 24 24"></svg>
        </div>
        <h1 class="text-2xl font-bold mt-4">Welcome Back</h1>
        <p class="text-slate-600">Log in to your account to continue.</p>
      </div>
      <form id="loginForm" method="post" action="/auth/login" hx-post="/auth/login" hx-swap="none">
        <div class="mb-4">
          <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter your username" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" />
        </div>
        {% set label='Password' %}{% set name='password' %}{% set type='password' %}{% set placeholder='Enter your password' %}{% include 'components/form_field.html' %}

        {% if error %}
        <div id="loginError" class="mb-4 text-red-700 bg-red-100 rounded p-3">{{ error }}</div>
        {% else %}
        <div id="loginError" class="hidden"></div>
        {% endif %}

        <div class="mt-4">
            <button id="loginButton" type="submit" class="w-full bg-primary text-white rounded-lg h-12" style="background-color:#137fec;color:#ffffff">Login</button>
        </div>
      </form>
      <script>
        // Basic client-side check to ensure fields are present before submit
        document.getElementById('loginForm').addEventListener('submit', function(e){
          const user = document.getElementById('username').value || '';
          const pass = document.querySelector('input[name="password"]').value || '';
          if(!user || !pass){
            e.preventDefault();
            const el = document.getElementById('loginError');
            el.classList.remove('hidden');
            el.classList.add('mb-4','text-red-700','bg-red-100','rounded','p-3');
            el.textContent = 'Username and password are required.';
            return false;
          }
        });
      </script>
    </div>
  </div>
</body>
</html>
