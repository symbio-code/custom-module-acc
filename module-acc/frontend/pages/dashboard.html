{% extends 'layouts/app.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-3xl font-bold">Dashboard</p>
      <div class="flex items-center gap-2 mt-1">
        <a class="text-slate-500 hover:text-primary" href="#">Home</a>
        <span class="text-slate-400">/</span>
        <span class="text-slate-700">Dashboard</span>
      </div>
    </div>
    {% if role in ['admin','accountant'] %}
    <button class="bg-primary text-white rounded-lg px-4 h-10 flex items-center gap-2"><span class="material-symbols-outlined">add</span>New Transaction</button>
    {% endif %}
  </div>

  {% include 'components/stats_cards.html' %}

  <div class="rounded-xl p-6 border bg-white dark:bg-slate-900">
    <h3 class="text-lg font-semibold">Cash Flow Overview</h3>
    <p class="text-sm text-slate-500">Monthly income vs. expenses</p>
    <div class="mt-4 h-72 flex items-center justify-center bg-slate-50 dark:bg-slate-800/50 rounded-lg">[Chart]</div>
  </div>
</div>
{% endblock %}
