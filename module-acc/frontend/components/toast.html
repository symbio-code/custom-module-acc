<!-- Toast notification container: append toasts dynamically via JS -->
<div id="toast-container" class="fixed bottom-6 right-6 space-y-2" style="z-index: 9999;"></div>

<script>
  /**
   * Show a toast notification with auto-dismiss
   * @param {string} message - Message to display
   * @param {string} type - 'success' | 'error' | 'warning' | 'info' (default: 'info')
   * @param {number} duration - Auto-dismiss after ms (0 = manual dismiss)
   */
  window.showToast = function(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container')
    if (!container) return

    const toast = document.createElement('div')
    const bgColor = {
      success: 'bg-green-600',
      error: 'bg-red-600',
      warning: 'bg-amber-600',
      info: 'bg-blue-600'
    }[type] || 'bg-blue-600'

    toast.className = `${bgColor} text-white px-4 py-3 rounded shadow-lg flex items-center justify-between gap-3 animate-in fade-in slide-in-from-right-4 duration-300`
    toast.innerHTML = `
      <span>${message}</span>
      <button onclick="this.parentElement.remove()" class="ml-2 text-white hover:opacity-75">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      </button>
    `
    container.appendChild(toast)

    if (duration > 0) {
      setTimeout(() => {
        toast.classList.add('animate-out', 'fade-out', 'slide-out-to-right-4', 'duration-300')
        setTimeout(() => toast.remove(), 300)
      }, duration)
    }
  }
</script>
