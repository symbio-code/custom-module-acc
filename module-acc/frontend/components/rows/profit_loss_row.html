<tr class="border-b border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800">
  <td class="py-2 px-4 font-mono text-xs">{{ row.code }}</td>
  <td class="py-2 px-4" style="padding-left: {{ (row.level | default(0)) * 20 }}px">
    {{ row.name }}{% if row.is_group %} <span class="text-xs text-slate-500">(Group)</span>{% endif %}
  </td>
  <td class="text-right py-2 px-4">{{ "%.2f"|format(row.period_debit) }}</td>
  <td class="text-right py-2 px-4">{{ "%.2f"|format(row.period_credit) }}</td>
  <td class="text-right py-2 px-4 font-semibold">{{ "%.2f"|format(row.amount) }}</td>
</tr>
