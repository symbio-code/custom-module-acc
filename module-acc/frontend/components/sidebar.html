<aside class="fixed left-0 top-0 z-20 flex h-full w-64 flex-col bg-white dark:bg-background-dark dark:border-r dark:border-slate-800 shadow-md">
  <div class="flex h-full flex-col justify-between p-4">
    <div class="flex flex-col gap-4">
      <div class="flex items-center gap-3 px-3 py-2">
        <div class="bg-primary/20 text-primary flex items-center justify-center rounded-lg size-10">
          <span class="material-symbols-outlined text-2xl">payments</span>
        </div>
        <div class="flex flex-col">
          <h1 class="text-slate-900 dark:text-white text-base font-bold">FinApp</h1>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Accounting</p>
        </div>
      </div>

      <nav class="flex flex-col gap-2 mt-4">
        <a class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary" href="#" hx-get="/dashboard" hx-target="#content">
          <span class="material-symbols-outlined fill text-2xl">dashboard</span>
          <p class="text-sm font-semibold">Dashboard</p>
        </a>

        <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300" href="#" hx-get="/accounts" hx-target="#content">
          <span class="material-symbols-outlined text-2xl">account_balance_wallet</span>
          <p class="text-sm">Accounts</p>
        </a>

        <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300" href="#" hx-get="/journal" hx-target="#content">
          <span class="material-symbols-outlined text-2xl">receipt_long</span>
          <p class="text-sm">Journal Entry</p>
        </a>

        <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300" href="#" hx-get="/ledger" hx-target="#content">
          <span class="material-symbols-outlined text-2xl">book</span>
          <p class="text-sm">General Ledger</p>
        </a>

        <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300" href="#" hx-get="/reports" hx-target="#content">
          <span class="material-symbols-outlined text-2xl">assessment</span>
          <p class="text-sm">Reports</p>
        </a>
      </nav>
    </div>

    <div class="flex flex-col gap-1 relative">
      <!-- Profile: toggles a small panel with user info -->
      <button id="sidebar-profile-btn" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 w-full text-left" type="button"
        hx-get="/profile/panel" hx-target="#sidebar-profile-panel" hx-swap="innerHTML">
        <span class="material-symbols-outlined text-2xl">person</span>
        <p class="text-sm">Profile</p>
      </button>

      <!-- Profile panel (hidden by default) -->
      <div id="sidebar-profile-panel" class="hidden absolute left-full bottom-0 mb-0 ml-3 w-64 rounded-lg border bg-white dark:bg-slate-900 p-0 shadow-lg z-30">
        <!-- profile content will be loaded here via HTMX from /profile/panel -->
        <div class="p-4 text-sm text-slate-500">Click to load profile…</div>
      </div>

      <!-- Settings: toggles a small dropdown with logout -->
      <div class="relative">
        <button id="sidebar-settings-btn" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 w-full text-left" type="button">
          <span class="material-symbols-outlined text-2xl">settings</span>
          <p class="text-sm">Settings</p>
        </button>
        <div id="sidebar-settings-panel" class="hidden absolute left-full bottom-0 ml-3 w-44 rounded-lg border bg-white dark:bg-slate-900 p-2 shadow z-30">
          <a href="#" class="block px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-800 rounded">Account Settings</a>
          <form hx-post="/auth/logout" hx-swap="none">
            <button type="submit" class="block w-full mt-1 px-3 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900 rounded text-left">Logout</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</aside>
